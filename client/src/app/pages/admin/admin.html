<header class="admin__header">
  <a class="admin__brand" routerLink="/admin">Logística Comunidad · Admin</a>

  <nav class="admin__nav" aria-label="Secciones de administración">
    @for (section of sections(); track section.path) {
      <a class="admin__link" [routerLink]="section.path" routerLinkActive="admin__link--active" [routerLinkActiveOptions]="{ exact: section.exact ?? false }">{{ section.label }}</a>
    }
  </nav>

  @if (session.user(); as user) {
    <span class="admin__user">{{ user.fullName }}</span>
    <ui-button variant="ghost" (clicked)="logout()">Salir</ui-button>
  }
  <ui-theme-toggle />
</header>

<router-outlet />
