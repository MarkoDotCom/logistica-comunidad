<main class="page">
  <ui-section-header heading="Inicio" subtitle="Resumen de la comunidad" />

  @if (failed()) {
    <p class="ui-form__error">No se pudo cargar el resumen.</p>
  } @else if (summary()) {
    <div class="home__metrics">
      @for (m of metrics(); track m.label) {
        <a class="home__metric" [routerLink]="m.link">
          <span class="home__value">{{ m.value | number }}</span>
          <span class="home__label">{{ m.label }}</span>
          @if (m.hint) {
            <span class="home__hint">{{ m.hint }}</span>
          }
        </a>
      }
    </div>
  } @else {
    <p class="ui-muted">Cargando…</p>
  }

  <div class="page__grid">
    <ui-card heading="Comunidades" content="Gestión por niveles: comunidades, sus edificios, sus departamentos y el detalle de cada uno con cuentas y contratos." [actions]="goActions" (action)="go('/admin/comunidades')" />
    <ui-card heading="Árbol de unidades" content="Vista global de todas las unidades. Aquí se mueven de una rama a otra y se restauran las eliminadas." [actions]="goActions" (action)="go('/admin/unidades')" />
    <ui-card heading="Usuarios" content="Crear, buscar y modificar personas, sus roles y ver los contratos de cada una." [actions]="goActions" (action)="go('/admin/usuarios')" />
    <ui-card heading="Roles" content="Conjuntos de permisos de la aplicación y las personas que los tienen." [actions]="goActions" (action)="go('/admin/roles')" />
  </div>
</main>
