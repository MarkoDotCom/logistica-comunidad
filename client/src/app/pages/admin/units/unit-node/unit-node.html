<div class="unit-node" [class.unit-node--inactive]="!node().isActive" [style.--depth]="depth()">
  <div class="unit-node__row">
    @if (node().children.length) {
      <button type="button" class="unit-node__toggle" [attr.aria-expanded]="open()" [attr.aria-label]="open() ? 'Contraer' : 'Expandir'" (click)="open.set(!open())">
        {{ open() ? '▾' : '▸' }}
      </button>
    } @else {
      <span class="unit-node__toggle unit-node__toggle--leaf" aria-hidden="true"></span>
    }
    <ui-tag>{{ kindLabels[node().kind] }}</ui-tag>
    <span class="unit-node__label">{{ label(node()) }}</span>
    @if (node().name) {
      <span class="ui-muted">{{ node().code }}</span>
    }
    @if (!node().isActive) {
      <span class="ui-muted">· inactiva</span>
    }
    <span class="unit-node__actions">
      <ui-button variant="ghost" (clicked)="add.emit(node())">+ Hijo</ui-button>
      <ui-button variant="secondary" (clicked)="edit.emit(node())">Modificar</ui-button>
    </span>
  </div>

  @if (open()) {
    @for (child of node().children; track child.id) {
      <app-unit-node [node]="child" [depth]="depth() + 1" (add)="add.emit($event)" (edit)="edit.emit($event)" />
    }
  }
</div>
